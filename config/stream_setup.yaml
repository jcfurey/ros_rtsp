# Set up your streams to rtsp here.
port: "8554"

# Optional: require a username/password on every stream (basic auth). Omit for
# open access. When set, clients connect as rtsp://user:pass@<ip>:8554/<mount>.
# Fail-closed: a malformed auth/tls block (missing user / missing or unloadable
# cert) stops the node with a FATAL log instead of serving unprotected.
#auth:
#  user: myuser
#  pass: mysecret

# Optional: serve over TLS (rtsps://). 'cert' is a PEM file holding the server
# certificate AND its private key. Combine with 'auth' above for encrypted +
# authenticated streaming. Generate a self-signed test cert with:
#   openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out crt.pem \
#     -days 365 -subj "/CN=localhost" && cat crt.pem key.pem > cert.pem
#tls:
#  cert: /path/to/cert.pem

streams: # Cannot rename - must leave this as is.

  # Minimal: point at a ROS Image topic and serve it as an encoded RTSP stream.
  # Only 'type' and 'source' are required. Everything else has a sensible default:
  #   mountpoint -> "/<stream name>"   (here: /backcam)
  #   bitrate    -> 500 kbit/s
  #   codec      -> h264
  #   encoder    -> x264 (software)
  #   framerate  -> 10 fps (advertised to the encoder for topic streams)
  #   caps       -> none: the topic is served at its native resolution
  backcam:
    type: topic
    source: /camera/image_raw
    #                       -> rtsp://<server_ip>:8554/backcam

  # Same thing with every optional knob spelled out.
  frontcam:
    type: topic
    source: /usb_cam1/image_raw
    mountpoint: /front      # RTSP path (default: /<stream name>)
    bitrate: 800            # encoder target, kbit/s (default: 500)
    codec: h264             # h264 (default) or h265/hevc
    encoder: x264           # x264 (default, software) or nvenc (NVIDIA GPU)
    framerate: 15           # fps the source topic delivers (default: 10)
    # Optional 'caps': rescale and/or cap the framerate before encoding. videorate +
    # videoscale are inserted automatically, so these values may differ from the
    # incoming topic (here: 15 fps in, downsampled to 10 fps on the wire).
    caps: video/x-raw,framerate=10/1,width=640,height=480

  # A non-ROS GStreamer source (e.g. a v4l2 camera) encoded and served directly.
  usbcam:
    type: cam
    source: "v4l2src device=/dev/video0 ! videoconvert ! videoscale ! video/x-raw,framerate=15/1,width=1280,height=720"
    mountpoint: /usb
    bitrate: 500

  # Advanced: for any other hardware encoder (Intel/AMD VA-API, Jetson, ...) set
  # 'encoder_override' to the full encoder + output caps fragment. It is used
  # verbatim in place of the built-in encoder. Examples:
  #
  #   # Intel / AMD VA-API
  #   encoder_override: "videoconvert ! vaapih264enc rate-control=cbr bitrate=500 keyframe-period=30 ! video/x-h264, profile=baseline"
  #
  #   # NVIDIA Jetson (bitrate is in bits/sec here)
  #   encoder_override: "nvvidconv ! nvv4l2h264enc bitrate=500000 insert-sps-pps=true iframeinterval=30 maxperf-enable=1 ! video/x-h264, profile=baseline"
