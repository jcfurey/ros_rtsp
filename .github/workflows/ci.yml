name: CI

# Build (and lint) the package on ROS Noetic on every push / PR so regressions
# like a bad #include or a broken CMake target are caught automatically.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  industrial_ci:
    name: ROS ${{ matrix.ROS_DISTRO }} (${{ matrix.ROS_REPO }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {ROS_DISTRO: noetic, ROS_REPO: main}       # released deps
          - {ROS_DISTRO: noetic, ROS_REPO: testing}    # in-development deps
    steps:
      - uses: actions/checkout@v4
      # industrial_ci runs in a matching ROS_DISTRO container: rosdep-install the
      # deps from package.xml (incl. GStreamer), then catkin build + run tests.
      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: ${{ matrix.ROS_DISTRO }}
          ROS_REPO: ${{ matrix.ROS_REPO }}
