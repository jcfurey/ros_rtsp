#!/usr/bin/env python
# Live bitrate tuning for all active topic streams (rqt_reconfigure / dynamic_reconfigure).
#
# bitrate is in kbit/sec and applies to every stream whose media is currently
# prepared (i.e. has a connected client). A value of 0 means "leave each stream
# at the bitrate from its YAML config" - this is the default so that simply
# starting rqt_reconfigure does not clobber your per-stream settings. Set a
# non-zero value to override all live encoders at once.
PACKAGE = "ros_rtsp"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, int_t

gen = ParameterGenerator()

gen.add("bitrate", int_t, 0,
        "Live encoder bitrate in kbit/s applied to all active streams "
        "(0 = keep each stream's configured bitrate)",
        0, 0, 50000)

exit(gen.generate(PACKAGE, "ros_rtsp", "Bitrate"))
